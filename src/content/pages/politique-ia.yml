  - type: texte
    titre: Autres domaines
    texte: Il y a d'autres domaines où l'IA peut être utilisée, et ces domaines devraient continuer à augmenter dans le futur. Nous nous engageons à être attentifs à ces nouveaux usages, à ce qu'ils génèrent, et à mettre à jour cette politique IA dès que nous avons suffisamment de retours d'expérience.
