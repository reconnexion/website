  - type: texte
    titre: Recherche
    texte: Pour mener des recherches sur un sujet, nous pouvons être amenés à utiliser des outils IA. Mais les résultats de la recherche seront toujours présentés par un être humain.
    image: ''
    fond: blanc
    image_alt: ''
    image_avant: false
    image_pleine_largeur: false
