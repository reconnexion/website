  - type: texte
    titre: Développement (code)
    texte: |-
      Les outils IA étant tellement à l'aise et habitués à concevoir des interfaces, que ce soit pour des sites web ou des applications, nous ne voyons pas de problème à les laisser entièrement coder ces interfaces. L'intérêt étant de pouvoir rapidement déployer des applications, et à moindre frais.

      Même si nous faisons du vibe-coding (sans regarder le code final), nous encourageons l'usage de framework connus, afin que le code soit plus facilement lisible ou corrigible par des développeurs qui souhaiteraient se pencher dessus.

      En revanche pour les couches plus sensibles, comme les contributions à ActivityPods ou NextGraph, il est essentiel que les développeurs aient une compréhension claire de ce qui est produit, car il s'agit de l'infrastructure sur laquelle va reposer tout le Réseau Social Universel. Des IA peuvent être utilisées comme assistants, notamment pour le débogage ou la compréhension de l'architecture, mais tout le code doit avoir été entièrement relu et compris par le développeur avant d'être soumis.
    image: ''
    fond: blanc
    image_alt: ''
    image_avant: false
