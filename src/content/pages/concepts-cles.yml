  - type: texte_image
    surtitre: ''
    titre: Les réseaux sociaux sont devenus anti-sociaux
    texte: Ces applications qui ont été au début une occasion de retrouver nos amis et de garder un lien sont, au fil du temps, devenues de véritables drogues qui isolent des millions de personnes. Les vidéos courtes se sont imposées partout car elles sont hautement addictives. La solitude est bien plus rentable que la rencontre et l'entraide.
    image: /images/tour-1.png
    fond: blanc
    image_alt: ''
    image_lien: ''
    inverse: true
    image_large: false
    image_logo: false
    texte_grand: false
  - type: texte_image
    surtitre: ''
    titre: Les alternatives vertueuses n'arrivent pas à émerger
    texte: Une application sociale a, par nature, besoin de beaucoup d'utilisateurs pour fonctionner. Or sans moyens de communication important, il est difficile d'amener d'un seul coup un grand nombre d'utilisateurs. C'est pourquoi la plupart des applications sociales vivotent, même si elles répondent à un vrai besoin.
    image: /images/chateau-casse.png
    fond: blanc
    image_alt: ''
    image_lien: ''
    inverse: false
    image_large: false
    image_logo: false
    texte_grand: false
  - type: texte_image
    surtitre: ''
    titre: L'architecture actuelle du web favorise la compétition
    texte: Le premier acteur sur le terrain rafle la mise. C'est pourquoi les startups du numérique ont attiré tant d'investisseurs. Mais cette architecture hyper-compétitive est une tragédie pour celles et ceux qui veulent créer des communs au service de la société.
    image: /images/forteresse-facebook.png
    fond: blanc
    image_alt: ''
    image_lien: ''
    inverse: true
    image_large: false
    image_logo: false
    texte_grand: false
