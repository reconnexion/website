  - type: texte_image
    surtitre: ''
    titre: Le Réseau Social Universel
    texte: 'Il s''agit d''un réseau social ouvert, qui n''est pas lié à une application en particulier, mais sur lequel peut se brancher n''importe quelle application. Il est "universel" comme l''est la déclaration des droits de l''Homme. Il s''appuie sur des protocoles reconnus: tant qu''on respecte ces protocoles, on peut construire des applications dessus.'
    image: /images/RX_2026T1_VISUELS_01242.png
    fond: blanc
    image_alt: ''
    image_lien: ''
    inverse: true
    image_large: false
    image_logo: false
    texte_grand: false
  - type: texte_image
    surtitre: ''
    titre: Cela est possible grâce au porte-données
    texte: Les applications enregistrent les données des utilisateurs dans leur "sac à dos", qu'ils peuvent emmener avec eux lorsqu'ils se connectent sur d'autres applications. Les données sont enregistrées dans un format ouvert pour faciliter le partage des données entre applications.
    image: /images/RX_2026T1_VISUELS_01244(1).png
    fond: blanc
    image_alt: ''
    image_lien: ''
    inverse: false
    image_large: false
    image_logo: false
    texte_grand: false
  - type: texte_image
    surtitre: ''
    titre: Les applications mutualisent utilisateurs et données
    texte: Cela permet aux applications de mutualiser les utilisateurs et les données, dans une boucle vertueuse. Plus il y a d'utilisateurs, plus il y a de données, plus les nouvelles applications ont des chances de réussir. Comme il n'y a plus de mur, cela facilite la coopération.
    image: /images/RX_2026T1_VISUELS_01235(2).png
    fond: blanc
    image_alt: ''
    image_lien: ''
    inverse: true
    image_large: false
    image_logo: false
    texte_grand: false
