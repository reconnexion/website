    titre: Le Réseau Social Universel
    fond: degrade
    piliers:
      - icone: cadenas
        titre: Je garde le contrôle sur mes données
        texte: Toutes mes données sont stockées dans mon porte-donnée, chez un hébergeur de confiance.
      - icone: globe
        titre: Je communique avec qui je veux
        texte: Je peux échanger avec mes contacts, quels que soient les applications ou les hébergeurs qu'ils utilisent.
      - icone: marche_arret
        titre: Je peux changer d'appli à tout moment
        texte: Si une application ne me plaît plus, je peux en utiliser une autre en conservant toutes mes données.
