  - type: texte_image
    fond: bleu
    titre: Forum de discussion
    texte: |-
      Si vous avez des questions, des suggestions ou si vous souhaitez contribuer à Reconnexion, nous vous invitons à vous rendre sur notre [forum de discussion](https://forum.reconnexion.coop) qui commence tout juste à s’animer.

      Se créer un compte sur le forum est un moyen simple de rester au courant des nouveautés, puisque cela vous permet de recevoir (au maximum une fois par semaine) un petit récapitulatif des messages les plus populaires.
    image: /images/accueil/forum.webp
    image_alt: Page d'accueil du forum de discussion de Reconnexion
    inverse: false
    image_large: true
  - type: colonnes
    fond: blanc
    colonnes:
      - titre: Je veux rencontrer des gens
        texte: Des rencontres sont organisées tous les 3 mois à différents endroits en France, c'est un excellent moyen de découvrir le projet et de rencontrer les gens qui le portent.
        bouton_texte: Rencontres
        bouton_lien: /hackathon
      - titre: Je veux comprendre le côté technique
        texte: Les applications que nous proposons sont toutes open source et fonctionnent de manière décentralisée. Les personnes plus techniques sont invitées à le découvrir.
        bouton_texte: Le coin technique
        bouton_lien: /coin-technique
      - titre: Je souhaite contribuer
        texte: Il y a différentes moyens de contribuer au projet Reconnexion, en fonction de ses envies, besoins, compétences et bien sûr de ses disponibilités. N'hésitez pas !
        bouton_texte: Contribuer
        bouton_lien: /contribuer
