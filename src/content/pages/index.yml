  - type: texte_image
    surtitre: Notre raison d'être
    titre: Faciliter l'émergence d'un Réseau Social Universel
    texte: |-
      Les applications que nous proposons sont toutes open source et fonctionnent de manière décentralisée.

      Des rencontres sont organisées tous les 3 mois à différents endroits en France : c'est un excellent moyen de découvrir le projet et de rencontrer les gens qui le portent.
