titre: Nos services
slug: services
description: Les services commerciaux proposés par la SCIC Reconnexion autour des applications sociales citoyennes reposant sur le Réseau Social Universel.
sections:
  - type: bandeau
    surtitre: ''
    titre: Nos services
    texte: Vous avez un projet d'application ou une application existante que vous souhaiteriez porter sur le Réseau Social Universel ? Reconnexion peut vous accompagner sur tous les aspects, de la conception au développement jusqu'au déploiement sur les territoires.
    image: ''
    bouton_texte: ''
    bouton_lien: ''
  - type: offre
    bouton_texte: Demander un devis
    bouton_lien: mailto:contact@reconnexion.coop?subject=Demande de devis
    fond: degrade
    nom: Forfait de base
    prix: 9 000 €
    sous_titre: Votre application conçue, réalisée et déployée sur les territoires
    titre_liste: Ce que comprend le forfait
    elements:
      - texte: Une réunion d'évaluation (gratuite / sans engagement)
      - texte: Jusqu'à trois itérations de conception de maquettes
      - texte: Réalisation de l'application par un développeur (avec IA)
      - texte: Mise en ligne de l'application sur votre nom de domaine
      - texte: Promotion de l'application sur Reconnexion
      - texte: Déploiement de l'application sur 3 territoires via des ambassadeurs
    mention: ''
  - type: texte_image
    surtitre: ''
    titre: La réunion d'évaluation
    texte: |-
      L'entretien préliminaire permet…

      Après cet entretien, nous évaluons les possibilités de synergie avec d'autres acteurs de notre réseau, et nous vous faisons des propositions de partenariats qui peuvent à la fois réduire le coût pour vous, mais aussi vous assurer que votre application touchera sa cible, en prenant en compte un plus large éventail de besoins. S'associer avec d'autres acteurs, c'est aussi démultiplier ses canaux de communication.
    image: /images/services/cycle.svg
    fond: blanc
    image_alt: "Le cycle de réalisation d'une application : idées et besoins, conception, réalisation, déploiement"
    inverse: true
    image_large: false
    image_logo: true
    texte_grand: true
  - type: texte_image
    titre: La place de l'IA dans Reconnexion
    texte: |-
      Les outils IA aujourd'hui permettent de réaliser en quelques jours ce qui aurait normalement pris plusieurs mois. Pour des conceptions d'interfaces, l'IA ne fait pas d'erreur, car elle peut s'appuyer sur le code de milliers d'applications existantes.

      Grâce au temps gagné, nous pouvons mettre plus d'énergie sur la conception et pour faire des aller-retours entre la production et vous. Et cela permet de réduire les couts pour vous, d'au moins 10x.

      Nous vous invitons à consulter notre politique IA pour connaitre, en toute transparence, là où nous utilisons l'IA et là où nous refusons de l'utiliser.
    image: /images/services/puce-ia.svg
    image_alt: ''
    fond: blanc
    inverse: false
    image_logo: true
    texte_grand: true
  - type: texte_image
    surtitre: ''
    titre: La mise à jour vers NextGraph
    texte: Au printemps 2027, nous prévoyons de passer tout le Réseau Social Universel (utilisateurs, données et applications) sur le logiciel NextGraph. **Cette mise à jour sera faite gratuitement pour nos clients.** Avec NextGraph, toutes les données sont chiffrées, ce qui renforce considérablement la sécurité. Nous vous invitons à regarder le [webinaire que nous avons donné à ce sujet en mai 2026](/coin-technique).
    image: /images/services/nextgraph.svg
    fond: blanc
    image_alt: NextGraph
    inverse: true
    image_large: false
    image_logo: true
    texte_grand: true
  - type: grille_cartes
    titre: Les avantages du Réseau Social Universel
    texte: ''
    fond: gris
    boutons:
      - texte: En savoir plus
        lien: /concepts-cles
    colonnes: '2'
    cartes:
      - icone: personnes
        titre: Utilisateurs présents
        texte: Si les utilisateurs sont déjà présents sur le Réseau Social Universel, ils n'ont pas à se recréer un compte. La masse critique d'utilisateurs, qui est le plus gros enjeu pour les applications sociales, est plus facilement atteinte.
      - icone: donnees
        titre: Réutilisation de données existantes
        texte: Votre application a accès au profil et au carnet de contacts de l'utilisateur, mais aussi potentiellement à toutes les autres données des applications sur le Réseau Social Universel.
      - icone: bouclier
        titre: Maintenance facilitée
        texte: Toutes les données de l'utilisateur sont enregistrées sur son porte-donnée. Vous n'avez donc pas à vous occuper de sauvegarde, de sécurité.
      - icone: poignee_de_main
        titre: Coopération facilitée
        texte: Les données et utilisateurs pouvant circuler librement d'une application à une autre, il est plus facile d'envisager des coopérations avec d'autres acteurs car il n'y a pas de question de propriété (les données sont uniquement la propriété de l'utilisateur).
    texte_grand: true
