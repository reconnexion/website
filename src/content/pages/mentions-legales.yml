    titre: Éditeur du site
    texte: |-
      Ce site Internet est édité par la société coopérative d’intérêt collectif (SCIC) Reconnexion.

      Reconnexion est une SCIC-SAS à capital variable au capital social de 14 050€ (août 2025), entreprise de l’économie sociale et solidaire (ESS).

      La mission de la coopérative est de faciliter l’émergence d’un réseau social universel favorisant la rencontre, l’entraide et la coopération.

      **Siège social** : Reconnexion / 10 rue Auguste Martel - 60200 Compiègne
      **Immatriculée au RCS de Compiègne** sous le numéro 990 452 625
