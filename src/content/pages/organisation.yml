  - type: texte
    titre: ''
    texte: |-
      Le projet Reconnexion est porté par une [Société Coopérative d'Intérêt Collectif](https://les-scic.coop) (SCIC). Créée en août 2025, elle réunit à ce jour 33 sociétaires (dont 4 organisations) répartis sur 5 collèges.

      Le choix de la SCIC a été naturel pour un projet "écosystémique" tel que Reconnexion. Cela permet de s'assurer que toutes les parties prenantes puissent avoir leur mot à dire dans la gouvernance, et ainsi que le projet oeuvre véritablement en faveur du bien commun.

      Par ailleurs, le format de coopérative garanti une gouvernance équitable, chaque sociétaire ayant une voix, quel que soit le nombre de parts qu'elle possède dans la coopérative. Comme il n'est pas possible de faire de plus-value sur les parts, et que les dividendes sont réduits (voire nulle), cela évite que les bénéfices partent vers des actionnaires.
