  - type: texte
    titre: Les collèges
    texte: |-
      La coopérative comprend 5 collèges. Dans les SCIC, les collèges permettent de manifester un "groupement d'intérêt". Chaque vote est pondéré en fonction du collège.

      - **Soutiens financiers** : toute personne qui souhaite simplement soutenir le projet (à partir de 50€)
      - **Équipe opérationnelle** : les salariés, prestataires et bénévoles qui s'activent au jour le jour pour faire vivre le projet
      - **Co-créateurs d'applications** : les personnes qui apportent des besoins, des idées et/ou des compétences pour réaliser des applications sur le Réseau Social Universel
      - **Bénéficiaires** : les personnes qui déploient les applications sur leur territoire, ou les simples utilisateurs
      - **Partenaires** : les organisations partenaires de Reconnexion
