  - type: texte
    titre: Le cercle d'ancrage
    texte: Lorsque la coopérative aura plus de 100 sociétaires, il sera possible (lors d'une AG) de décider de mettre en place un cercle d'ancrage, qui aura pour but de conseiller le 1er lien (directeur) sur la stratégie à mener. Chaque collège y sera représenté par 1 à 3 personnes.
