  - type: grille_cartes
    titre: Tarifs et inscription
    texte: Nous proposons un tarif différencié afin de permettre à toutes les personnes de venir. **Nous ne serons pas bénéficiaires sur l'évènement**, donc si vous avez la possibilité de donner un peu plus que le montant indiqué, ce serait grandement apprécié !
    icone: billet
    fond: blanc
    texte_apres: Pour des raisons d'organisation, il ne sera malheureusement pas possible de venir en cours de route. L'inscription est pour les deux jours, du jeudi 9h30 au vendredi 17h. En revanche, **il est possible de venir aux soirées du mercredi et du jeudi, qui sont ouvertes à tous** (sans inscription, sauf si vous souhaitez réserver un repas).
    boutons: []
    texte_grand: false
    colonnes: '3'
    cartes:
      - icone: personnes
        titre: Tarif normal
        texte: |-
          **Dès 80 € / 2 jours**

          Si vous venez en tant qu'individu ou en tant que membre d'une association sans salariés.
      - icone: poignee_de_main
        titre: Tarif salarié
        texte: |-
          **Dès 120 € / 2 jours**

          Si votre inscription est payée par l'organisation à laquelle vous appartenez.
      - icone: coeur
        titre: Tarif solidaire/étudiant
        texte: |-
          **Dès 30 € / 2 jours**

          Pour les personnes avec des moyens limités. Nous proposons 8 places à ce tarif.
