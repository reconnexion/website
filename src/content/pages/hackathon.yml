  - type: texte
    titre: Le lieu
    texte: Nous avons la chance d'être accueillis pour ce premier hackathon à [La Filature](https://lafilature-villeurbanne.fr/), à Villeurbanne (agglomération lyonnaise). Il s'agit d'un tiers-lieu qui est actuellement co-géré par [Code Communs](https://codecommun.tibillet.coop/), une coopérative numérique (mais pas que…) avec laquelle nous partageons beaucoup de valeurs et qui est notamment derrière l'outil de billetterie open-source TiBillet.
    image: /images/hackathon/la-filature.webp
    icone: lieu
    fond: blanc
    image_alt: La cour de La Filature, avec des tables où des personnes discutent au soleil.
    image_2: /images/hackathon/plan-la-filature.png
    image_2_alt: Plan de La Filature, avec les bâtiments, la cantine, le pavillon, les toilettes et la terrasse.
    texte_apres: À la Filature, il y aura tout l'espace dont nous aurons besoin, avec 2 grandes salles et une plus petite, ce qui permettra un travail serein en équipes. Nous aurons aussi la chance de pouvoir nous restaurer sur place, grâce à la cantine du lieu. Et si le temps le permet, nous pourrons également profiter du grand espace extérieur.
