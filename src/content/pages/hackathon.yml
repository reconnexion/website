  - type: questions
    fond: blanc
    titre: Questions fréquentes
    questions:
      - question: À qui s'adresse le tarif solidaire ?
        reponse: Toute personne qui a des moyens limités, étudiante ou non, et pour qui 80 € (ajoutés aux autres frais) serait trop important. Pour ne pas trop mettre à mal notre modèle économique (nous ne sommes déjà bénéficiaires sur l'événement), nous limitons ce tarif à 8 places. Donc faites le choix en conscience !
      - question: Est-ce que les équipes peuvent se passer d'IA ?
        reponse: Nous comprenons et partageons les doutes qu'il y a sur le développement et l'usage de l'IA dans la société. Si vous préférez réaliser les maquettes sans Claude Design, vous pouvez le signaler en commentaire lors de l'inscription et nous essaierons de rassembler au moins une équipe qui n'utilisera pas l'IA pour la génération de la maquette.
      - question: Je suis développeur·se, est-ce que je pourrai coder ?
        reponse: Si vous êtes développeur·se et souhaitez coder, nous vous invitons à l'indiquer à l'inscription. Nous aimerions si possible avoir un développeur par équipe, qui pourra dès le vendredi matin (ou le jeudi soir s'il ou elle est vraiment motivé·e !) commencer à implémenter la maquette sur le Réseau Social Universel.
    texte_apres: Si vous avez d'autres questions, n'hésitez pas à [nous contacter](/contact) !
