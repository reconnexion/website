titre: Hackathon novembre 2026
slug: nous-rencontrer/hackathon-nov-2026
description: Le 1er Hackathon des Applications Citoyennes de Reconnexion, les 26 et 27 novembre 2026 à La Filature (Villeurbanne).
sections:
  - type: bandeau
    surtitre: ''
    titre: |-
      1er Hackathon
      des applications citoyennes
    sous_titre: 26-27 novembre 2026 à Villeurbanne (Lyon)
    texte: |-
      Vous êtes membre d'une organisation de l'ESS, expert métier ou simple citoyen ? Vous souhaitez contribuer à un web qui serait au service de l'humain, et qui permettrait d'outiller les changements sociétaux en cours et à venir ?
      Nous vous invitons à venir vivre, pendant deux jours, une expérience de coopération lors de laquelle 40 personnes imaginerons le futur Réseau Social Universel et concevrons, en équipe, 6 applications citoyennes avec un impact social fort.
