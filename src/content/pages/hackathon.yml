    etapes:
      - jour: Mercredi 25
        moment: Soir (dès 18h30)
        titre: Soirée d'interconnaissance
        etiquette: Ouvert à tous
        icone: coeur
        texte: Pour celles et ceux qui peuvent arriver la veille, nous proposerons un temps convivial d'interconnaissance.
      - jour: Jeudi 26
        moment: Matin (9h30-13h)
        titre: Ouverture et rêve
        etiquette: ''
        icone: soleil
        texte: La journée commencera par une découverte du Réseau Social Universel et des problèmes qu'il résout, à travers un jeu de cartes. Ensuite, toujours avec des cartes, on imaginera des applications innovantes à partir des données partagées qui se trouvent potentiellement sur le porte-données.
      - jour: Jeudi 26
        moment: Après-midi (15h-18h)
        titre: Planification
        etiquette: ''
        icone: crayon
        texte: Après une pause de 2h pour se restaurer, on entrera dans le vif du sujet avec la formation des 6 équipes autour d'idées d'applications choisies en commun. Le travail de brainstorming, puis de convergence sera soumis en fin de journée à une IA, qui génèrera une première maquette (les équipes qui veulent travailler sans IA pourront le réaliser sur papier).
      - jour: Jeudi 26
        moment: Soir (dès 18h30)
        titre: Soirée festive
        etiquette: Ouvert à tous
        icone: fete
        texte: L'apéro de début de soirée sera l'occasion d'avoir des premiers retours des maquettes de la part des autres équipes ou des visiteurs. Ensuite la soirée se poursuivra avec repas, musique et peut-être danse (programme en cours d'élaboration).
      - jour: Vendredi 27
        moment: Matin (9h30-12h)
        titre: Action
        etiquette: ''
        icone: outils
        texte: Il s'agira d'itérer sur la première maquette. Qu'est-ce qui pourrait être amélioré ? Quelles autres fonctionnalités pourrait-on imaginer ? Pendant ce temps, les développeurs de chaque équipe pourront, s'ils le souhaitent, essayer d'implémenter la maquette sur le Réseau Social Universel avec de l'IA.
      - jour: Vendredi 27
        moment: Midi (12h-13h)
        titre: Démonstration
        etiquette: ''
        icone: presentation
        texte: Toutes les équipes présentent une démo de leur application et récoltent des feedbacks des autres équipes.
      - jour: Vendredi 27
        moment: Après-midi (15h-17h)
        titre: Célébration et clôture
        etiquette: ''
        icone: fusee
        texte: Après le repas, chaque équipe se retrouvera pour réfléchir aux prochains petits pas imaginables pour leur projet, puis on finira par une clôture.
