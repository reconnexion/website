    image_alt: "1er Hackathon des Applications Citoyennes : deux jours pour co-construire le futur Réseau Social Universel. 26-27 novembre 2026, La Filature / Villeurbanne."
    image_avant: true
    image_pleine_largeur: true
    texte: |-
      A vos agendas ! Le prochain hackathon de Reconnexion aura lieu les jeudi 26 et vendredi 27 novembre prochains dans le tiers-lieu [La Filature](https://lafilature-villeurbanne.fr/) à Villeurbanne.

      Pendant deux jours, une quarantaine de personnes se retrouveront pour imaginer le futur Réseau Social Universel et concevoir ensemble 6 applications citoyennes avec un impact social fort. Après le hackathon, ces applications seront réalisées par des développeurs pour pouvoir être testées sur différents territoires (pas besoin d'être développeur pour participer au hackathon !)

      Si vous n'êtes pas disponibles sur deux journées complètes, notez que nous proposerons également deux soirées conviviales les mercredi 25 et jeudi 26 novembre.

      Nous sommes en train de finaliser la page de présentation et le formulaire d'inscription, mais nous vous invitons à réserver dès maintenant ces dates.
