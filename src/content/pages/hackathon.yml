  - type: texte
    titre: Pourquoi ce hackathon ?
    texte: |-
      Notre société est submergée par le numérique, mais il manque pourtant des outils simples et conviviaux qui aident les citoyens à se rencontrer, s'entraider et coopérer. Les projets qui vont dans ce sens se heurtent systématiquement à la difficulté de réunir une masse critique d'utilisateurs.

      C'est comme si chaque application était obligée de recréer un réseau social de zéro, tout en étant en compétition avec toutes les autres !

      Le projet de Réseau Social Universel, porté par la [coopérative Reconnexion](/), vise à mutualiser les utilisateurs et leurs données au sein d'un réseau social ouvert et neutre. Chaque nouvelle application enrichit le Réseau Social Universel et ouvre de nouvelles possibilités d'échanges et de partages entre les citoyens.

      Quatre applications sont [déjà en ligne](/applications), mais ce n'est que le début. Ce hackathon sera l'occasion d'imaginer 6 nouvelles applications, que des développeurs brancheront ensuite sur le Réseau Social Universel, afin qu'elles puissent être testées sur des territoires.
