  - type: texte
    titre: Pourquoi ce hackathon ?
    texte: |-
      La société actuelle est submergée par le numérique, mais il manque pourtant des outils simples et conviviaux qui aident les citoyens à se rencontrer, s'entraider et coopérer. Les projets qui vont dans ce sens se heurtent tous à la difficulté de réunir une masse critique d'utilisateurs. C'est comme si chaque application était obligée de recréer un réseau social de zéro, tout en étant en compétition avec toutes les autres !

      Le Réseau Social Universel est un projet porté par la [coopérative Reconnexion](/) qui vise à mutualiser les utilisateurs et leurs données au sein d'un réseau social ouvert et neutre. Chaque application créée sur le Réseau Social Universel vient enrichir le réseau et ouvre de nouvelles possibilités d'échanges et de partages entre les citoyens.

      Quatre applications sont [déjà en ligne](/applications), mais ce n'est que le début. Le hackathon sera l'occasion d'imaginer 6 nouvelles applications, que des développeurs brancheront ensuite sur le Réseau Social Universel, afin qu'elles puissent être testées en vrai par une multitude d'utilisateurs.

      Si vous souhaitez participer à une expérience de coopération unique tout en apportant vos idées et compétences à un projet à fort impact, inscrivez-vous dès maintenant ! (Le nombre de places est limité.)
