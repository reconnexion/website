    cartes:
      - icone: repas
        titre: Repas
        texte: Nous proposerons des repas végétariens, cuisinés sur place par l'équipe de la Filature, pour 10 €. Ils seront disponibles le mercredi soir, le jeudi midi, le jeudi soir et le vendredi midi. Sur le formulaire d'inscription, vous pourrez réserver vos repas et indiquer si vous avez un régime particulier.
      - icone: lit
        titre: Hébergement
        texte: Le lieu n'offre malheureusement pas d'hébergement, mais nous allons mettre en place un système d'hébergement solidaire, afin que les Lyonnais qui le peuvent puissent accueillir les personnes venant de loin. Indiquez-le dans le formulaire si vous avez des besoins de ce côté et nous ferons notre possible !
      - icone: train
        titre: Transports
        texte: 'La Filature se trouve à 10 min de l''arrêt "République - Villeurbanne" du métro A. Depuis la gare de Lyon Perrache, il est donc possible d''arriver sur le lieu en moins de 30 minutes. Si vous souhaitez faire du covoiturage, nous avons mis en place un évènement sur [CoviEvent](https://covievent.org/covoiturage/1er-hackathon-des-applications-citoyennes/b9d160e6e6667b8f78aeee4cbd819786#dates-covoiturage).'
