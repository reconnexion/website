    texte: Vous êtes membre d'une organisation de l'ESS, expert métier ou simple citoyen ? Vous avez des idées d'application ou vous avez identifié des besoins numériques qui ne sont pas remplis actuellement ? Nous vous invitons à venir vivre, pendant deux jours, une expérience de coopération lors de laquelle 40 personnes imaginerons le futur Réseau Social Universel et concevrons, en équipe, 6 applications citoyennes avec un impact social fort.
