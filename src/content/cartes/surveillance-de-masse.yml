essentiel: 'Une surveillance généralisée rendue possible par la technologie. Au lieu de surveiller des individus précis, tout le monde est espionné. Justifiée par la lutte contre le terrorisme, cette pratique est aujourd’hui généralisée dans tout l’occident. Ex : Snowden'
