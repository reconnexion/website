couleur: '#f00020'
accroche: Votre liberté d’expression est conditionné au bon vouloir des gouvernements et entreprises
essentiel: 'Avec la complicité des entreprises, la censure des opposants politiques est de plus en plus courante. Des méthodes comme le shadow ban permettent d’isoler des individus ou masquer des sujets sans qu’on le sache et sans qu’une décision de justice ait été prise. Ex : comptes FB des Gilets Jaunes, shadow ban Twitter (révélé par Twitter leaks)'
