titre: Dispersion des données
slug: dispersion-des-donnees
type: fleaux
couleur: '#f00020'
accroche: Ne plus savoir où se trouvent ses données personnelles
essentiel: Au vu du droit européenn, nos données personnelles font partie de nous. Or elles se retrouvent dispersées sur des centaines d’applications, qui elles-mêmes les stockent parfois sur des centaines de serveurs dispersés au 4 coins de la terre. Nous sommes litéralement éclatés.
