description: |-
  Cette application est un annuaire de compétences. Chacun peut déclarer ses savoirs, et aussi son niveau de connaissance (débutant, intermédiaire, avancé, expert). Ensuite d’autres personnes du réseau peuvent recommander cette compétence, p.ex. si elle ont pu en bénéficier.

  Comme pour [Bienvenue chez moi](/applications/bienvenue-chez-moi), on ne voit les compétences que des personnes qui sont dans notre réseau, ou qui nous ont été recommandées par des personnes de notre réseau.
