description: |-
  L’Entraide est une application de petites annonces qui ne sont visibles que des personnes qui font partie de votre réseau de confiance. Contrairement à la plupart des sites de ce genre très orientés "commerce", l’intention principale de ce site est l’entraide.

  Cela n’empêche pas de vendre ou d’acheter en euros, car pour le moment nous avons tous besoins d’euros pour vivre. Cependant nous proposons aussi la possibilité de donner, de faire du troc ou de vendre en [monnaie libre](https://monnaie-libre.fr).
