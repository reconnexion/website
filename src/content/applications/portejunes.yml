description: |-
  PorteJunes permet d'envoyer et de recevoir des Ğ1, la monnaie libre, entre membres du Réseau Social Universel.

  Le porte-monnaie s'active en un clic : il est créé à la demande et relié à votre profil, si bien que vos contacts peuvent vous payer directement, sans avoir à connaître l'adresse de votre portefeuille.

  On peut payer un contact ou scanner un QR code, recevoir des Ğ1 en affichant son propre QR code, suivre l'historique de ses opérations et retrouver ses contacts.
