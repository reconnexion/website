  - libelle: Description
    valeur: |-
      L'application Bienvenue chez moi est en fonctionnement depuis fin 2021 et, jusqu’à maintenant, elle a surtout été utilisée dans la région de Compiègne avec une communauté de 500 utilisateurs.

      Elle a pour but d’inciter les personnes à organiser des rencontres chez elles. Sa particularité par rapport à d’autres plateformes est que les événements sont tous privés: il faut être invités personnellement pour voir la description de l’événement et s’y inscrire.

      On pourrait penser que ce fonctionnement restrictif a pour résultat de réduire le nombre de participants, mais au contraire, le fait de recevoir une invitation personnelle crée un intérêt plus fort pour la proposition. De plus, les personnes osent proposer des sujets de rencontre originaux, car ils savent qui verra l’invitation.

      On est vraiment sur un réseau de confiance. Les invités peuvent voir qui participe à la rencontre (et parfois ils s’inscrivent uniquement parce que ce sera l’occasion de revoir telle ou telle personne). Comme les profils sont privés par défaut eux aussi, on ne voit cependant que les personnes qui font partie de notre réseau, les autres étant affichés comme “inconnus”. A la fin de la rencontre, on aura en revanche la possibilité d’ajouter ces “inconnus” (qui sont, entre temps, devenus connus!) à notre réseau.

      Ainsi le réseau qui se tisse est basé sur des rencontres réelles. Et lorsqu’on veut proposer une rencontre soi-même, on pourra inviter des personnes de confiance, que l’on a déjà côtoyé à d’autres occasions.
